<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartLib Digital | Smart School Library Platform</title>
  
  <script>
    /**
     * PENCEGAHAN BLANK SCREEN (DEPLOYMENT FIX)
     * Inisialisasi environment dasar agar library tidak error saat mencari process.env
     */
    window.process = { 
      env: { 
        API_KEY: "", 
        NODE_ENV: "production" 
      } 
    };
    window.global = window;
    
    // Deteksi error pemuatan modul atau runtime awal
    window.addEventListener('error', function(e) {
      console.error("Runtime Error:", e);
      const root = document.getElementById('root');
      if (root && (root.innerHTML === '' || root.innerHTML.includes('Inisialisasi'))) {
        root.innerHTML = `
          <div style="padding:40px; text-align:center; font-family:sans-serif; background:#f8fafc; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <div style="background:white; padding:40px; border-radius:32px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.1); border:1px solid #fee2e2; max-width:480px; width:90%;">
              <div style="background:#fef2f2; width:64px; height:64px; border-radius:20px; display:flex; align-items:center; justify-content:center; margin:0 auto 24px;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
              </div>
              <h3 style="color:#1e293b; margin:0 0 12px 0; font-size:20px; font-weight:800;">Gagal Memuat Sistem</h3>
              <p style="color:#64748b; font-size:14px; margin-bottom:32px; line-height:1.6;">
                SmartLib gagal memuat komponen. Ini biasanya terjadi karena masalah koneksi ke server library (esm.sh). Silakan tekan tombol di bawah untuk menyegarkan sistem.
              </p>
              <button onclick="location.reload(true)" style="width:100%; padding:16px; background:#800000; color:white; border:none; border-radius:16px; font-weight:700; cursor:pointer; box-shadow:0 10px 15px -3px rgba(128, 0, 0, 0.3); transition: transform 0.2s active:scale-95;">Refresh Halaman</button>
              <p style="margin-top:24px; font-size:10px; color:#cbd5e1; font-family:monospace; word-break:break-all;">${e.message || 'Unknown Error'}</p>
            </div>
          </div>
        `;
      }
    });
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; overflow-x: hidden; }
    #root:empty::before {
      content: 'Menghubungkan ke SmartLib Server...';
      display: flex; align-items: center; justify-content: center; height: 100vh;
      font-weight: 700; color: #800000; font-size: 1rem;
      background: #f8fafc;
    }
    .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 30s linear infinite; }
    @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
  </style>

  <!-- Clean Import Map strictly using React 19.0.0 to prevent version conflicts -->
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.463.0?deps=react@19.0.0",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.40.0",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@4.0.379",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx" crossorigin></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
